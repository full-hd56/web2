<div class="min-h-screen p-3 flex flex-col gap-3 box-border">

  <!-- หมายเลข rider -->
  <div class="border-2 border-black p-3">
    หมายเลข rider : {{ riderId }}
  </div>

  <div>งานวันนี้</div>
  <div>รายละเอียดวันนี้ : หยิบข้าวกล่องทั้งหมด {{ totalBoxes }} กล่อง</div>

  <!-- รายการงาน -->
  <div class="flex flex-col gap-3">
    @for (job of jobs; track $index) {
      <div class="border-2 border-black p-3 flex items-center justify-between gap-2"
           [class.opacity-40]="job.done">

        <div>
          <div>จุดที่ {{ $index + 1 }}</div>
          <div>{{ job.detail }}</div>
          <div>{{ job.boxes }} กล่อง</div>
        </div>

        <div class="flex gap-2">
          <a [href]="navUrl(job)" target="_blank" rel="noopener"
             class="border-2 border-black px-3 py-2 text-center">
            นำทาง
          </a>
          <button type="button" (click)="markDone(job)" [disabled]="job.done"
                  class="border-2 border-black px-3 py-2 cursor-pointer">
            {{ job.done ? 'ส่งแล้ว' : 'ส่งสำเร็จ' }}
          </button>
        </div>

      </div>
    }
  </div>
</div>
